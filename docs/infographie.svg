<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .h1{font-size:46px;font-weight:700;fill:#0F172A}
      .sub{font-size:22px;fill:#475569}
      .num{font-size:20px;font-weight:700;fill:#FFFFFF}
      .st{font-size:25px;font-weight:700;fill:#0F172A}
      .tx{font-size:18px;fill:#334155}
      .chip{font-size:16px;font-weight:700}
      .lane{font-size:19px;font-weight:700;fill:#FFFFFF}
      .small{font-size:17px;fill:#334155}
      .gt{font-size:20px;font-weight:700;fill:#0F172A}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- Titre -->
  <text x="70" y="88" class="h1">Pitch vidéo programmatique : du PDF à l'URL vidéo, sans clic manuel</text>
  <text x="70" y="128" class="sub">Exercice 8 · Growth Hacking ESIEA · Option A (commercial ESN) et Option B (candidat augmenté) · aucun outil no-code (Make, Zapier, n8n…)</text>

  <!-- Bandeau tour de contrôle -->
  <rect x="70" y="160" width="1780" height="64" rx="14" fill="#1F4E79"/>
  <text x="100" y="201" class="lane">GOOGLE SHEET « TOUR DE CONTRÔLE »</text>
  <text x="560" y="201" font-size="18" fill="#DBEAFE">PRODUCTION (URL des PDF, statut, durée, lien vidéo) · PROMPTS (rôle, template, température, modèle) · CONFIG_LOG (journal horodaté)</text>
  <line x1="300" y1="224" x2="300" y2="268" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="315" y="254" font-size="16" fill="#64748B">déclenchement : menu ▶ ou mode automatique (5 min)</text>
  <line x1="1690" y1="268" x2="1690" y2="224" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1672" y="254" font-size="16" fill="#64748B" text-anchor="end">URL vidéo + logs écrits automatiquement</text>

  <!-- 6 étapes -->
  <g>
    <!-- carte générique : x, couleur -->
    <rect x="70" y="276" width="275" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="70" y="276" width="275" height="10" rx="5" fill="#0EA5E9"/>
    <circle cx="108" cy="330" r="22" fill="#0EA5E9"/><text x="101" y="337" class="num">1</text>
    <text x="142" y="339" class="st">Extraction</text>
    <text x="92" y="388" class="tx">3 PDF lus sur Drive</text>
    <text x="92" y="416" class="tx">OCR Drive, repli Gemini</text>
    <text x="92" y="444" class="tx">si PDF scanné</text>
    <text x="92" y="482" class="tx">Option A : noms, e-mails,</text>
    <text x="92" y="510" class="tx">téléphones, liens masqués</text>
    <text x="92" y="538" class="tx">avant tout envoi à l'IA</text>
    <rect x="92" y="600" width="150" height="32" rx="16" fill="#E0F2FE"/><text x="108" y="622" class="chip" fill="#0369A1">Drive API v3</text>
    <rect x="92" y="642" width="150" height="32" rx="16" fill="#E0F2FE"/><text x="108" y="664" class="chip" fill="#0369A1">Apps Script</text>

    <rect x="370" y="276" width="275" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="370" y="276" width="275" height="10" rx="5" fill="#8B5CF6"/>
    <circle cx="408" cy="330" r="22" fill="#8B5CF6"/><text x="401" y="337" class="num">2</text>
    <text x="442" y="339" class="st">Script IA</text>
    <text x="392" y="388" class="tx">JSON strict scène par</text>
    <text x="392" y="416" class="tx">scène : scene_id, titre,</text>
    <text x="392" y="444" class="tx">mots-clés, voix-off</text>
    <text x="392" y="482" class="tx">120-145 mots (45-60 s)</text>
    <text x="392" y="520" class="tx">Contrôle des faits auto,</text>
    <text x="392" y="548" class="tx">3 essais puis validation</text>
    <text x="392" y="576" class="tx">humaine si échec</text>
    <rect x="392" y="600" width="226" height="32" rx="16" fill="#EDE9FE"/><text x="408" y="622" class="chip" fill="#6D28D9">Gemini 3.1 Flash-Lite</text>
    <rect x="392" y="642" width="150" height="32" rx="16" fill="#EDE9FE"/><text x="408" y="664" class="chip" fill="#6D28D9">API REST</text>

    <rect x="670" y="276" width="275" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="670" y="276" width="275" height="10" rx="5" fill="#F59E0B"/>
    <circle cx="708" cy="330" r="22" fill="#F59E0B"/><text x="701" y="337" class="num">3</text>
    <text x="742" y="339" class="st">Visuels</text>
    <text x="692" y="388" class="tx">1 diapositive par scène</text>
    <text x="692" y="416" class="tx">(gabarits A corporate /</text>
    <text x="692" y="444" class="tx">B personal branding)</text>
    <text x="692" y="482" class="tx">Graphique d'adéquation</text>
    <text x="692" y="510" class="tx">calculé par le code</text>
    <text x="692" y="548" class="tx">Voix-off en notes →</text>
    <text x="692" y="576" class="tx">importable dans Vids</text>
    <rect x="692" y="600" width="170" height="32" rx="16" fill="#FEF3C7"/><text x="708" y="622" class="chip" fill="#B45309">Slides API</text>
    <rect x="692" y="642" width="170" height="32" rx="16" fill="#FEF3C7"/><text x="708" y="664" class="chip" fill="#B45309">Export PNG</text>

    <rect x="970" y="276" width="275" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="970" y="276" width="275" height="10" rx="5" fill="#EF4444"/>
    <circle cx="1008" cy="330" r="22" fill="#EF4444"/><text x="1001" y="337" class="num">4</text>
    <text x="1042" y="339" class="st">Voix-off</text>
    <text x="992" y="388" class="tx">Synthèse vocale FR</text>
    <text x="992" y="416" class="tx">(aucun clonage de voix)</text>
    <text x="992" y="454" class="tx">Calibrage auto du débit</text>
    <text x="992" y="482" class="tx">pour tenir 45-60 s</text>
    <text x="992" y="520" class="tx">Repérage des phrases</text>
    <text x="992" y="548" class="tx">pour les sous-titres</text>
    <rect x="992" y="600" width="130" height="32" rx="16" fill="#FEE2E2"/><text x="1008" y="622" class="chip" fill="#B91C1C">edge-tts</text>
    <rect x="992" y="642" width="200" height="32" rx="16" fill="#FEE2E2"/><text x="1008" y="664" class="chip" fill="#B91C1C">GitHub Actions</text>

    <rect x="1270" y="276" width="275" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="1270" y="276" width="275" height="10" rx="5" fill="#10B981"/>
    <circle cx="1308" cy="330" r="22" fill="#10B981"/><text x="1301" y="337" class="num">5</text>
    <text x="1342" y="339" class="st">Montage</text>
    <text x="1292" y="388" class="tx">Diapo + audio synchro</text>
    <text x="1292" y="416" class="tx">Zoom lent, fondus</text>
    <text x="1292" y="444" class="tx">Sous-titres incrustés</text>
    <text x="1292" y="472" class="tx">Mention « voix de</text>
    <text x="1292" y="500" class="tx">synthèse » à l'écran</text>
    <text x="1292" y="538" class="tx">MP4 1280×720 + GIF</text>
    <text x="1292" y="566" class="tx">d'aperçu cliquable</text>
    <rect x="1292" y="600" width="110" height="32" rx="16" fill="#D1FAE5"/><text x="1308" y="622" class="chip" fill="#047857">FFmpeg</text>
    <rect x="1292" y="642" width="110" height="32" rx="16" fill="#D1FAE5"/><text x="1308" y="664" class="chip" fill="#047857">Pillow</text>

    <rect x="1570" y="276" width="280" height="430" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="1570" y="276" width="280" height="10" rx="5" fill="#1F4E79"/>
    <circle cx="1608" cy="330" r="22" fill="#1F4E79"/><text x="1601" y="337" class="num">6</text>
    <text x="1642" y="339" class="st">Publication</text>
    <text x="1592" y="388" class="tx">MP4 sur Drive, partage</text>
    <text x="1592" y="416" class="tx">par lien (lecture)</text>
    <text x="1592" y="454" class="tx">URL, durée, date et</text>
    <text x="1592" y="482" class="tx">coût écrits dans la Sheet</text>
    <text x="1592" y="520" class="tx">Brouillon Gmail : GIF</text>
    <text x="1592" y="548" class="tx">→ vidéo + Calendly</text>
    <text x="1592" y="576" class="tx">(envoi manuel)</text>
    <rect x="1592" y="600" width="120" height="32" rx="16" fill="#DBEAFE"/><text x="1608" y="622" class="chip" fill="#1E3A8A">Web app</text>
    <rect x="1592" y="642" width="120" height="32" rx="16" fill="#DBEAFE"/><text x="1608" y="664" class="chip" fill="#1E3A8A">Gmail</text>
  </g>

  <!-- flèches entre cartes -->
  <g stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)">
    <line x1="347" y1="491" x2="366" y2="491"/>
    <line x1="647" y1="491" x2="666" y2="491"/>
    <line x1="947" y1="491" x2="966" y2="491"/>
    <line x1="1247" y1="491" x2="1266" y2="491"/>
    <line x1="1547" y1="491" x2="1566" y2="491"/>
  </g>
  <text x="960" y="742" font-size="17" fill="#64748B" text-anchor="middle">Étapes 1-3 et 6 : Google Apps Script · Étapes 4-5 : worker Python lancé par l'API REST GitHub (ou Colab en mode polling)</text>

  <!-- Garde-fous -->
  <rect x="70" y="770" width="580" height="250" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="96" y="812" class="gt">Zéro hallucination</text>
  <text x="96" y="850" class="small">• Chaque chiffre du script doit exister dans les PDF</text>
  <text x="96" y="880" class="small">• Extraits « mot pour mot » retrouvés dans les sources</text>
  <text x="96" y="910" class="small">• % de couverture calculé par le code, pas par l'IA</text>
  <text x="96" y="940" class="small">• Échec → statut A_VERIFIER, rendu bloqué</text>
  <text x="96" y="970" class="small">• Reprise après correction humaine du JSON</text>

  <rect x="670" y="770" width="580" height="250" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="696" y="812" class="gt">RGPD et transparence</text>
  <text x="696" y="850" class="small">• Option A : pseudonymisation avant l'appel au LLM</text>
  <text x="696" y="880" class="small">• Contrôle de fuite de nom dans le script généré</text>
  <text x="696" y="910" class="small">• Voix 100 % synthétique, aucun clonage ni avatar</text>
  <text x="696" y="940" class="small">• Mention « voix de synthèse » sur la vidéo</text>
  <text x="696" y="970" class="small">• Secrets dans les Propriétés et secrets GitHub</text>

  <rect x="1270" y="770" width="580" height="250" rx="16" fill="#0F172A"/>
  <text x="1296" y="812" font-size="20" font-weight="700" fill="#FFFFFF">Coût unitaire par vidéo</text>
  <text x="1296" y="870" font-size="52" font-weight="700" fill="#22D3EE">&lt; 0,01 $</text>
  <text x="1296" y="910" font-size="17" fill="#CBD5E1">Gemini ≈ 0,003-0,009 $ · edge-tts 0 $</text>
  <text x="1296" y="940" font-size="17" fill="#CBD5E1">GitHub Actions 0 $ (dépôt public ou quota gratuit)</text>
  <text x="1296" y="970" font-size="17" fill="#CBD5E1">Variante « pro » (Google TTS Neural2) ≈ 0,04 $</text>
  <text x="1296" y="1000" font-size="17" fill="#CBD5E1">≈ 2 à 4 min de la Sheet au lien vidéo</text>
</svg>
